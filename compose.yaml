name: gopanel
services:
  mysql:
    image: mysql:8.0.45@sha256:4af1f8815716546f5b12410f7621f37f93db8dd11a184706ef59111930b8c2ff
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gopanel}
      MYSQL_USER: ${DB_USER:-gopanel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
  app:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-gopanel}
      DB_USER: ${DB_USER:-gopanel}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_TLS: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    init: true
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/gopanel", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
volumes:
  mysql_data:
